<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekod Dana & Hutang Keluarga</title>
    <style>
        :root {
            --bg-color: #eef2f5;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --primary: #34495e;
            --accent: #27ae60;
            --danger: #e74c3c;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 480px;
            padding: 15px;
            animation: fadeIn 0.6s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
            border: 1px solid rgba(0,0,0,0.03);
        }
        h2, h3 { margin-top: 0; color: #1a252f; }
        input, button, select {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border-radius: 10px;
            border: 1px solid #dcdde1;
            box-sizing: border-box;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 5px rgba(52, 73, 94, 0.3);
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        button.btn-accent { background-color: var(--accent); }
        button.btn-danger { background-color: var(--danger); }
        .hidden { display: none !important; }
        
        #loading-section { text-align: center; margin-top: 40px; }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f1f2f6; padding-bottom: 15px; margin-bottom: 25px;}
        .balance-box { text-align: center; background: linear-gradient(135deg, #2c3e50, #34495e); color: white; border-radius: 16px; padding: 25px; margin-bottom: 20px; box-shadow: 0 10px 20px rgba(44, 62, 80, 0.2); }
        .balance-box h1 { margin: 10px 0 0 0; font-size: 36px; color: #2ecc71; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }
        
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background-color: var(--card-bg);
            padding: 25px; border-radius: 16px;
            width: 90%; max-width: 400px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            animation: fadeIn 0.3s ease-in-out;
            max-height: 90vh; overflow-y: auto;
        }
        .close-btn {
            background-color: transparent; color: var(--danger);
            border: none; text-align: right; padding: 0;
            font-size: 16px; margin-bottom: 15px; font-weight: bold;
        }

        .transaksi-item { border-bottom: 1px solid #f1f2f6; padding: 15px 0; display: flex; justify-content: space-between; align-items: center;}
        .transaksi-item:last-child { border-bottom: none; padding-bottom: 0; }
        .text-accent { color: var(--accent); font-weight: bold; font-size: 16px; }
        .transaksi-detail { font-size: 13px; color: #7f8c8d; margin-top: 4px; }
        .senarai-dana-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px dashed #eee; }
        .senarai-dana-item:last-child { border-bottom: none; }
    </style>
</head>
<body>

<div class="container">
    
    <div id="loading-section" class="card">
        <div class="loader"></div>
        <h3 id="loading-text" style="color: var(--primary);">Menyegerak data...</h3>
    </div>

    <div id="dashboard-section" class="hidden">
        <div class="header">
            <h3 id="user-role" style="margin:0; font-size: 16px;">Profil: Pengguna</h3>
            <button onclick="logKeluar()" id="btn-keluar" class="hidden" style="width: auto; padding: 8px 16px; background: #95a5a6; border-radius: 20px; font-size: 13px;">Keluar Admin</button>
        </div>

        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
            <div style="flex: 1; text-align: center; background: linear-gradient(135deg, #e67e22, #d35400); color: white; border-radius: 12px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
                <p style="margin:0; font-size: 12px; opacity: 0.9;">Hutang Abah</p>
                <h2 id="baki-abah" style="margin: 5px 0 0 0; font-size: 22px;">RM 0.00</h2>
            </div>
            <div style="flex: 1; text-align: center; background: linear-gradient(135deg, #9b59b6, #8e44ad); color: white; border-radius: 12px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
                <p style="margin:0; font-size: 12px; opacity: 0.9;">Hutang Emak</p>
                <h2 id="baki-emak" style="margin: 5px 0 0 0; font-size: 22px;">RM 0.00</h2>
            </div>
        </div>

        <div class="balance-box">
            <p style="margin:0; opacity: 0.8; font-size: 14px; letter-spacing: 0.5px;">JUMLAH KESELURUHAN DANA</p>
            <h1 id="total-dana">RM 0.00</h1>
        </div>

        <div id="tindakan-user" class="card hidden">
            <button class="btn-accent" onclick="bukaModalBayar()" style="padding: 16px; font-size: 16px; box-shadow: 0 4px 10px rgba(39, 174, 96, 0.3);">+ Rekod Transaksi Baharu</button>
        </div>

        <div id="tindakan-admin" class="card hidden">
            <h3 style="margin-bottom: 15px; font-size: 16px;">Panel Kawalan Abah</h3>
            <button class="btn-danger" onclick="bukaModalKeluar()" style="margin-bottom: 10px;">- Pengeluaran Dana</button>
            <button class="btn-accent" onclick="bukaModalBayar()" style="margin-bottom: 10px;">+ Rekod Transaksi Baharu</button>
            <button onclick="alert('Fungsi cetak PDF akan datang')">Cetak Laporan PDF</button>
        </div>

        <div class="card">
            <h3 style="font-size: 16px; margin-bottom: 15px;">Pecahan Dana Terkumpul</h3>
            <div id="senarai-dana"></div>
        </div>

        <div class="card">
            <h3 style="font-size: 16px; margin-bottom: 15px;">Sejarah Transaksi Terkini</h3>
            <div id="senarai-transaksi"></div>
        </div>
        
    </div>
</div>

<div id="modal-bayar" class="modal hidden">
    <div class="modal-content">
        <button class="close-btn" onclick="tutupModalBayar()">✖ Batal</button>
        <h3 style="color: var(--primary); margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px;">Transaksi Baharu</h3>
        
        <label style="font-size: 14px; font-weight: 600; color: #34495e;">Jenis Transaksi:</label>
        <select id="input-jenis">
            <option value="Bayar Hutang">Masukkan Dana Biasa</option>
            <option value="Abah tolong bayar hutang">Abah tolong bayar hutang</option>
            <option value="Hasif bayar semula hutang Abah">Hasif bayar semula hutang Abah</option>
            <option value="Emak tolong bayar hutang">Emak tolong bayar hutang</option>
            <option value="Hasif bayar semula hutang Emak">Hasif bayar semula hutang Emak</option>
        </select>

        <label style="font-size: 14px; font-weight: 600; color: #34495e; display:block; margin-top:10px;">Jumlah Bayaran (RM):</label>
        <input type="number" id="input-jumlah" placeholder="Contoh: 500.00" step="0.01">

        <label style="font-size: 14px; font-weight: 600; color: #34495e; display:block; margin-top:10px;">Catatan / Nota Bulan:</label>
        <input type="text" id="input-nota" placeholder="Contoh: Bayaran bulanan">

        <button class="btn-accent" onclick="hantarBayaran()" id="btn-hantar" style="margin-top: 20px; padding: 15px;">Sahkan Bayaran</button>
        <p id="status-hantar" style="text-align:center; font-size:14px; margin-top:10px; font-weight: 600;"></p>
    </div>
</div>

<div id="modal-keluar" class="modal hidden">
    <div class="modal-content">
        <button class="close-btn" onclick="tutupModalKeluar()">✖ Batal</button>
        <h3 style="color: var(--danger); margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px;">- Pengeluaran Dana</h3>
        
        <label style="font-size: 14px; font-weight: 600; color: #34495e;">Pilih Dana:</label>
        <select id="input-keluar-jenis">
            <option value="Dana Servis Veloz">Servis Veloz</option>
            <option value="Dana Servis Persona">Servis Persona</option>
            <option value="Dana Roadtax Veloz">Roadtax Veloz</option>
            <option value="Dana Roadtax Persona">Roadtax Persona</option>
            <option value="Tabungan Masa Depan">Tabungan Masa Depan</option>
        </select>

        <label style="font-size: 14px; font-weight: 600; color: #34495e; display:block; margin-top:10px;">Jumlah Keluarkan (RM):</label>
        <input type="number" id="input-keluar-jumlah" placeholder="Contoh: 150.00" step="0.01">

        <label style="font-size: 14px; font-weight: 600; color: #34495e; display:block; margin-top:10px;">Tujuan Pengeluaran:</label>
        <input type="text" id="input-keluar-tujuan" placeholder="Contoh: Beli tayar baru">

        <button class="btn-danger" onclick="hantarPengeluaran()" id="btn-keluar" style="margin-top: 20px; padding: 15px;">Sahkan Pengeluaran</button>
        <p id="status-keluar" style="text-align:center; font-size:14px; margin-top:10px; font-weight: 600;"></p>
    </div>
</div>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbybsw0VFwZhmtzDF9sYae9KYkdUROpgV5JyKMWnJLjXhFiW4myZ_l1Q8UadnXcBvnw/exec"; 
    let pinSemasa = "";

    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const adminPswd = urlParams.get('admin');

        if (adminPswd === "rahsia123") { 
            pinSemasa = "9999"; 
        } else {
            pinSemasa = "1234"; 
        }
        
        // --- LOGIK AUTOMATIK RM 500 ---
        document.getElementById('input-jenis').addEventListener('change', function() {
            if (this.value.includes("Hasif bayar semula")) {
                document.getElementById('input-jumlah').value = "500.00";
            } else {
                document.getElementById('input-jumlah').value = "";
            }
        });

        muatTurunData();
    };

    function muatTurunData() {
        const loadingText = document.getElementById('loading-text');
        const urlDenganParameter = `${GAS_URL}?pin=${pinSemasa}&action=getData`;

        fetch(urlDenganParameter)
            .then(response => response.json())
            .then(data => {
                if(data.status === "SUCCESS" || data.data) {
                    paparDashboard(data);
                } else {
                    loadingText.innerText = "Ralat: " + (data.message || "Gagal memuatkan rekod.");
                    loadingText.style.color = "var(--danger)";
                }
            })
            .catch(error => {
                loadingText.innerText = "Ralat pelayan / Tiada internet.";
                loadingText.style.color = "var(--danger)";
            });
    }

    function paparDashboard(data) {
        document.getElementById('loading-section').classList.add('hidden');
        document.getElementById('dashboard-section').classList.remove('hidden');
        
        const peranan = data.peranan || (pinSemasa === "9999" ? "ADMIN" : "USER");
        document.getElementById('user-role').innerHTML = peranan === "ADMIN" ? "👑 <b>Panel Abah</b>" : "👤 <b>Hasif & Fatini</b>";
        
        if (peranan === "ADMIN") {
            document.getElementById('btn-keluar').classList.remove('hidden');
            document.getElementById('tindakan-admin').classList.remove('hidden');
            document.getElementById('tindakan-user').classList.add('hidden');
        } else {
            document.getElementById('tindakan-user').classList.remove('hidden');
            document.getElementById('tindakan-admin').classList.add('hidden');
        }
        
        // --- KOD PRO: PENCARIAN REKOD SECARA DINAMIK & KESAN AUTOMATIK ---
        // Kod ini akan secara pintar mencari data sama ada ia dinamakan data.transaksi, data.data, atau data.records
        let sejarahTransaksi = data.transaksi || data.data || data.records || [];
        
        if (sejarahTransaksi.length === 0) {
            for (let key in data) {
                if (Array.isArray(data[key]) && data[key].length > 0) {
                    sejarahTransaksi = data[key];
                    break;
                }
            }
        }
        
        let kiraAbah = 0;
        let kiraEmak = 0;
        let htmlTransaksi = "";
        let adaRekod = false;
        
        sejarahTransaksi.forEach(t => {
            // Pengimbas automatik tak kira Huruf Besar, kecil atau ada jarak (space)
            const kJumlah = Object.keys(t).find(k => k.toLowerCase().trim() === 'jumlah');
            const kJenis = Object.keys(t).find(k => k.toLowerCase().trim() === 'jenis');
            const kTarikh = Object.keys(t).find(k => k.toLowerCase().trim() === 'tarikh');
            const kNota = Object.keys(t).find(k => k.toLowerCase().trim() === 'nota' || k.toLowerCase().trim() === 'kategori');

            const jumlah = parseFloat(t[kJumlah]) || 0;
            const jenisText = String(t[kJenis] || "").toLowerCase().trim();
            const jenisTrans = String(t[kJenis] || "");
            const tarikhTrans = String(t[kTarikh] || "");
            const notaTrans = String(t[kNota] || "");
            
            // Pengiraan Automatik Hutang
            if (jenisText.includes("abah tolong bayar")) {
                kiraAbah += jumlah;
            } else if (jenisText.includes("emak tolong bayar")) {
                kiraEmak += jumlah;
            } else if (jenisText.includes("hasif bayar semula hutang abah") || (jenisText.includes("hasif bayar semula") && !jenisText.includes("emak"))) {
                kiraAbah -= jumlah;
            } else if (jenisText.includes("hasif bayar semula hutang emak")) {
                kiraEmak -= jumlah;
            }

            // Senaraikan di bahagian Sejarah
            if (jenisTrans && !jenisText.includes("perbelanjaan") && !jenisText.includes("pendapatan")) {
                adaRekod = true;
                let isKeluaran = jenisText.includes("pengeluaran") || jenisText.includes("bayar semula");
                let warna = isKeluaran ? "var(--danger)" : "var(--accent)";
                let simbol = isKeluaran ? "-" : "+";

                htmlTransaksi += `
                    <div class="transaksi-item">
                        <div>
                            <div style="font-weight:bold; font-size: 14px; color:#2c3e50;">${jenisTrans}</div>
                            <div class="transaksi-detail">${tarikhTrans} ${notaTrans ? '• ' + notaTrans : ''}</div>
                        </div>
                        <div style="color: ${warna}; font-weight: bold; font-size: 16px;">${simbol} RM ${jumlah.toFixed(2)}</div>
                    </div>
                `;
            }
        });

        // Keluarkan Nilai ke Skrin
        document.getElementById('baki-abah').innerText = "RM " + Math.abs(kiraAbah).toFixed(2);
        document.getElementById('baki-emak').innerText = "RM " + Math.abs(kiraEmak).toFixed(2);
        
        // -------------------------------------------------------------------------

        const ringkasan = data.ringkasan || {};
        const dVelozS = parseFloat(ringkasan["Dana Servis Veloz"] || 0);
        const dPersonaS = parseFloat(ringkasan["Dana Servis Persona"] || 0);
        const dVelozR = parseFloat(ringkasan["Dana Roadtax Veloz"] || 0);
        const dPersonaR = parseFloat(ringkasan["Dana Roadtax Persona"] || 0);
        const dTabungan = parseFloat(ringkasan["Tabungan Masa Depan"] || 0);

        const totalDana = dVelozS + dPersonaS + dVelozR + dPersonaR + dTabungan;
        document.getElementById('total-dana').innerText = "RM " + totalDana.toFixed(2);

        const kunci = peranan === 'USER' ? '<span style="font-size:12px;">🔒</span>' : '';
        document.getElementById('senarai-dana').innerHTML = `
            <div class="senarai-dana-item"><span>🚗 Servis Veloz</span> <b>RM ${dVelozS.toFixed(2)} ${kunci}</b></div>
            <div class="senarai-dana-item"><span>🚗 Servis Persona</span> <b>RM ${dPersonaS.toFixed(2)} ${kunci}</b></div>
            <div class="senarai-dana-item"><span>📄 Roadtax Veloz</span> <b>RM ${dVelozR.toFixed(2)} ${kunci}</b></div>
            <div class="senarai-dana-item"><span>📄 Roadtax Persona</span> <b>RM ${dPersonaR.toFixed(2)} ${kunci}</b></div>
            <div class="senarai-dana-item" style="margin-top: 15px; border-top: 2px solid #f1f2f6; padding-top: 15px;">
                <span style="color: var(--accent); font-weight: bold; font-size:16px;">💰 Tabungan Masa Depan</span> 
                <b style="color: var(--accent); font-size:16px;">RM ${dTabungan.toFixed(2)} ${kunci}</b>
            </div>
        `;

        if (!adaRekod) {
            htmlTransaksi = "<p style='text-align:center; color:#95a5a6; font-size:14px; margin-top:20px;'>Belum ada rekod kewangan.</p>";
        }
        // Terbalikkan senarai supaya yang terkini (bawah sekali dalam Sheets) berada di atas aplikasi
        document.getElementById('senarai-transaksi').innerHTML = htmlTransaksi;
    }

    function logKeluar() {
        window.location.href = window.location.pathname;
    }

    function bukaModalBayar() {
        document.getElementById('modal-bayar').classList.remove('hidden');
        document.getElementById('status-hantar').innerText = "";
        document.getElementById('input-nota').value = "";
        
        const jenisSemasa = document.getElementById('input-jenis').value;
        if (jenisSemasa.includes("Hasif bayar semula")) {
            document.getElementById('input-jumlah').value = "500.00";
        } else {
            document.getElementById('input-jumlah').value = ""; 
        }
    }
    
    function tutupModalBayar() {
        document.getElementById('modal-bayar').classList.add('hidden');
    }
    
    function hantarBayaran() {
        const jenis = document.getElementById('input-jenis').value;
        const jumlah = parseFloat(document.getElementById('input-jumlah').value);
        const nota = document.getElementById('input-nota').value;
        const statusText = document.getElementById('status-hantar');

        if (!jumlah || jumlah <= 0) {
            statusText.innerText = "Sila pastikan jumlah sah!";
            statusText.style.color = "var(--danger)";
            return;
        }
        statusText.innerText = "Sedang merekod transaksi...";
        statusText.style.color = "var(--primary)";
        document.getElementById('btn-hantar').disabled = true;

        fetch(GAS_URL, {
            method: "POST",
            body: JSON.stringify({ action: "tambahTransaksi", pin: pinSemasa, jenis: jenis, kategori: "Rakaman Kewangan", jumlah: jumlah, nota: nota }),
            headers: { 'Content-Type': 'text/plain;charset=utf-8' }
        }).then(res => res.json()).then(data => {
            if(data.status === "SUCCESS") {
                statusText.innerText = "✓ Berjaya direkodkan!";
                statusText.style.color = "var(--accent)";
                setTimeout(() => { tutupModalBayar(); document.getElementById('btn-hantar').disabled = false; muatTurunData(); }, 1500);
            } else {
                statusText.innerText = "Ralat: " + data.message;
                statusText.style.color = "var(--danger)";
                document.getElementById('btn-hantar').disabled = false;
            }
        });
    }

    function bukaModalKeluar() {
        document.getElementById('modal-keluar').classList.remove('hidden');
        document.getElementById('status-keluar').innerText = "";
        document.getElementById('input-keluar-jumlah').value = "";
        document.getElementById('input-keluar-tujuan').value = "";
    }
    
    function tutupModalKeluar() {
        document.getElementById('modal-keluar').classList.add('hidden');
    }
    
    function hantarPengeluaran() {
        const jenisTabung = document.getElementById('input-keluar-jenis').value;
        const jumlah = parseFloat(document.getElementById('input-keluar-jumlah').value);
        const tujuan = document.getElementById('input-keluar-tujuan').value;
        const statusText = document.getElementById('status-keluar');

        if (!jumlah || jumlah <= 0 || !tujuan) {
            statusText.innerText = "Sila lengkapkan jumlah dan tujuan!";
            statusText.style.color = "var(--danger)";
            return;
        }

        statusText.innerText = "Memproses pengeluaran...";
        statusText.style.color = "var(--primary)";
        document.getElementById('btn-keluar').disabled = true;

        fetch(GAS_URL, {
            method: "POST",
            body: JSON.stringify({ action: "pengeluaranAdmin", pin: pinSemasa, jenisTabung: jenisTabung, jumlah: jumlah, tujuan: tujuan }),
            headers: { 'Content-Type': 'text/plain;charset=utf-8' }
        }).then(res => res.json()).then(data => {
            if(data.status === "SUCCESS") {
                statusText.innerText = "✓ Pengeluaran berjaya!";
                statusText.style.color = "var(--accent)";
                setTimeout(() => { tutupModalKeluar(); document.getElementById('btn-keluar').disabled = false; muatTurunData(); }, 1500);
            } else {
                statusText.innerText = "Ralat: " + data.message;
                statusText.style.color = "var(--danger)";
                document.getElementById('btn-keluar').disabled = false;
            }
        });
    }
</script>

</body>
</html>
