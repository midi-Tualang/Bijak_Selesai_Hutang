<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemantau Transaksi Premium & Dana</title>

    <!-- Open Graph / WhatsApp / Facebook Preview -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Pemantau Akaun - Rekod & Pengesahan Transaksi">
    <meta property="og:description" content="Semak baki hutang Abah, Emak, Dana dan Tabungan keluarga.">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-md mx-auto space-y-6">
        
        <header class="flex justify-between items-center py-4">
            <div>
                <h1 class="text-2xl font-bold text-white">Pemantau Akaun</h1>
                <p class="text-slate-400 text-sm">Rekod & Pengesahan Transaksi</p>
            </div>
            <div class="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center shadow-lg shadow-blue-500/30">
                <i class="fas fa-users text-white"></i>
            </div>
        </header>

        <!-- KAD 1: HUTANG -->
        <div class="glass-card rounded-2xl p-6 shadow-xl relative overflow-hidden">
            <div class="absolute top-0 right-0 p-4 opacity-5 text-6xl"><i class="fas fa-money-check-alt"></i></div>
            
            <div class="grid grid-cols-2 gap-4 mb-4 relative z-10">
                <div class="bg-slate-800/60 p-4 rounded-xl border border-slate-700/50">
                    <p class="text-slate-400 text-xs mb-1">Baki Hutang Abah</p>
                    <h2 id="bakiHutangAbah" class="text-2xl font-bold text-amber-400">RM 0.00</h2>
                </div>
                <div class="bg-slate-800/60 p-4 rounded-xl border border-slate-700/50">
                    <p class="text-slate-400 text-xs mb-1">Baki Hutang Emak</p>
                    <h2 id="bakiHutangEmak" class="text-2xl font-bold text-pink-400">RM 0.00</h2>
                </div>
            </div>

            <div class="bg-slate-800/60 p-4 rounded-xl border border-slate-700/50 mb-6 relative z-10 text-center">
                <p class="text-slate-400 text-xs mb-1">Jumlah Hutang Keseluruhan</p>
                <h2 id="bakiHutangKeseluruhan" class="text-3xl font-bold text-sky-400">RM 0.00</h2>
            </div>

            <button onclick="bukaModal()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl transition duration-300 shadow-lg shadow-blue-500/30 relative z-10">
                <i class="fas fa-plus mr-2"></i> Rekod Transaksi Baharu
            </button>
        </div>

        <!-- KAD 2: AGIHAN TABUNGAN & DANA -->
        <div class="glass-card rounded-2xl p-6 shadow-xl relative overflow-hidden">
            <div class="bg-slate-800/60 p-4 rounded-xl border border-slate-700/50 mb-4 text-center">
                <p class="text-slate-400 text-xs mb-1">Jumlah Keseluruhan Dana & Tabungan</p>
                <h2 id="total-dana" class="text-3xl font-bold text-emerald-400">RM 0.00</h2>
            </div>

            <h3 class="text-sm font-semibold text-slate-300 mb-3 border-b border-slate-700 pb-2">Pecahan Dana Terkumpul</h3>
            <div id="senarai-dana" class="space-y-2 mb-6">
                <!-- Data Dana akan dijana di sini -->
            </div>
            
            <button onclick="bukaModalKeluar()" class="w-full bg-red-600/80 hover:bg-red-500 text-white font-semibold py-3 rounded-xl transition duration-300 shadow-lg shadow-red-500/20 relative z-10">
                <i class="fas fa-minus-circle mr-2"></i> Pengeluaran Dana (Admin)
            </button>
        </div>

        <!-- KAD 3: TRANSAKSI TERKINI -->
        <div>
            <h3 class="text-lg font-semibold text-slate-300 mb-4">Rekod Terkini</h3>
            <div id="senaraiTransaksi" class="space-y-3">
                <p class="text-center text-slate-500 text-sm py-4">Memuat turun data...</p>
            </div>
        </div>

    </div>

    <!-- MODAL: TAMBAH TRANSAKSI -->
    <div id="modalBorang" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-800 rounded-2xl w-full max-w-sm p-6 border border-slate-700 shadow-2xl relative">
            <button onclick="tutupModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white">
                <i class="fas fa-times text-xl"></i>
            </button>
            <h3 class="text-xl font-bold text-white mb-4">Transaksi Baharu</h3>
            
            <form id="borangTransaksi" onsubmit="hantarData(event)" class="space-y-4">
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Jenis Transaksi</label>
                    <select id="jenis" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-blue-500">
                        <option value="Bayar Hutang">Masukkan Dana Biasa (Agihan)</option>
                        <option value="Abah tolong bayar hutang">Abah tolong bayar hutang</option>
                        <option value="Hasif bayar semula hutang Abah">Hasif bayar semula hutang Abah</option>
                        <option value="Emak tolong bayar hutang">Emak tolong bayar hutang</option>
                        <option value="Hasif bayar semula hutang Emak">Hasif bayar semula hutang Emak</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Jumlah (RM)</label>
                    <input type="number" step="0.01" id="jumlah" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" placeholder="Contoh: 150">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Catatan / Nota</label>
                    <input type="text" id="nota" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-blue-500" placeholder="Opsional">
                </div>
                
                <button type="submit" id="butangHantar" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-xl transition duration-300 mt-4 shadow-lg shadow-emerald-500/30">
                    Sahkan & Hantar
                </button>
            </form>
        </div>
    </div>

    <!-- MODAL: PENGELUARAN DANA -->
    <div id="modalKeluar" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-800 rounded-2xl w-full max-w-sm p-6 border border-slate-700 shadow-2xl relative">
            <button onclick="tutupModalKeluar()" class="absolute top-4 right-4 text-slate-400 hover:text-white">
                <i class="fas fa-times text-xl"></i>
            </button>
            <h3 class="text-xl font-bold text-white mb-4 text-red-400">- Pengeluaran Dana</h3>
            
            <form id="borangKeluar" onsubmit="hantarPengeluaran(event)" class="space-y-4">
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Pilih Dana</label>
                    <select id="input-keluar-jenis" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-red-500">
                        <option value="Dana Servis Veloz">Servis Veloz</option>
                        <option value="Dana Servis Persona">Servis Persona</option>
                        <option value="Dana Roadtax Veloz">Roadtax Veloz</option>
                        <option value="Dana Roadtax Persona">Roadtax Persona</option>
                        <option value="Tabungan Masa Depan">Tabungan Masa Depan</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Jumlah Keluarkan (RM)</label>
                    <input type="number" step="0.01" id="input-keluar-jumlah" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-red-500" placeholder="Contoh: 150.00">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Tujuan Pengeluaran</label>
                    <input type="text" id="input-keluar-tujuan" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-red-500" placeholder="Contoh: Beli tayar baru">
                </div>
                
                <button type="submit" id="butangKeluar" class="w-full bg-red-600 hover:bg-red-500 text-white font-semibold py-3 rounded-xl transition duration-300 mt-4 shadow-lg shadow-red-500/30">
                    Sahkan Pengeluaran
                </button>
            </form>
        </div>
    </div>

    <script>
        const URL_HUTANG = "https://script.google.com/macros/s/AKfycbwVQVd52gEqiMPxDfiWz4LB63KESiasL_CDYfxBsE-_V8U9dwQ0_-HDBsLW5P-Bqks/exec";
        const URL_DANA = "https://script.google.com/macros/s/AKfycbybsw0VFwZhmtzDF9sYae9KYkdUROpgV5JyKMWnJLjXhFiW4myZ_l1Q8UadnXcBvnw/exec";

        document.getElementById('jenis').addEventListener('change', function() {
            if (this.value.includes("Hasif bayar semula")) {
                document.getElementById('jumlah').value = "500.00";
            } else {
                document.getElementById('jumlah').value = "";
            }
        });

        function bukaModal() { 
            document.getElementById('modalBorang').style.display = 'flex'; 
            if (document.getElementById('jenis').value.includes("Hasif bayar semula")) {
                document.getElementById('jumlah').value = "500.00";
            }
        }
        function tutupModal() { document.getElementById('modalBorang').style.display = 'none'; }
        function bukaModalKeluar() { document.getElementById('modalKeluar').style.display = 'flex'; }
        function tutupModalKeluar() { document.getElementById('modalKeluar').style.display = 'none'; }

        async function muatData() {
            const container = document.getElementById('senaraiTransaksi');
            container.innerHTML = '<p class="text-center text-slate-500 text-sm py-4"><i class="fas fa-spinner fa-spin mr-2"></i> Menyegerak sistem...</p>';

            try {
                const [resHutang, resDana] = await Promise.all([
                    fetch(URL_HUTANG).then(r => r.json()).catch(() => ({})),
                    fetch(`${URL_DANA}?pin=9999&action=getData`).then(r => r.json()).catch(() => ({}))
                ]);
                
                paparData(resHutang, resDana);
            } catch (error) {
                container.innerHTML = '<p class="text-center text-red-400 text-sm">Gagal memuat turun rekod.</p>';
            }
        }

        function paparData(resHutang, resDana) {
            
            // --- 1. PENGIRAAN FRONTEND KEBAL UNTUK HUTANG ---
            const dataHutang = resHutang.data || [];
            let bakiAbah = 0;
            let bakiEmak = 0;

            dataHutang.forEach(item => {
                // Pengimbas "Mata Helang" - akan cari apa sahaja lajur yang ada ejaan "jenis", "kategori", "jumlah"
                const kJenis = Object.keys(item).find(k => k.toLowerCase().includes('jenis'));
                const kKategori = Object.keys(item).find(k => k.toLowerCase().includes('kategori'));
                const kJumlah = Object.keys(item).find(k => k.toLowerCase().includes('jumlah')); 
                
                const jenisTxt = kJenis ? String(item[kJenis]).toLowerCase() : "";
                const kategoriTxt = kKategori ? String(item[kKategori]).toLowerCase() : "";
                const jumlahVal = kJumlah ? parseFloat(item[kJumlah]) : 0;

                if (!isNaN(jumlahVal)) {
                    if (jenisTxt.includes("abah tolong bayar")) {
                        bakiAbah += jumlahVal;
                    } else if (jenisTxt.includes("emak tolong bayar")) {
                        bakiEmak += jumlahVal;
                    } else if (jenisTxt.includes("hasif bayar semula hutang abah") || (jenisTxt.includes("hasif bayar semula") && !jenisTxt.includes("emak")) || kategoriTxt.includes("kepada abah")) {
                        bakiAbah -= jumlahVal;
                    } else if (jenisTxt.includes("hasif bayar semula hutang emak") || kategoriTxt.includes("kepada emak")) {
                        bakiEmak -= jumlahVal;
                    } else if (jenisTxt.includes("bayar hutang") && kategoriTxt.includes("abah")) { 
                        // Menampung logik format sheet Log_Transaksi
                        bakiAbah -= jumlahVal;
                    } else if (jenisTxt.includes("bayar hutang") && kategoriTxt.includes("emak")) {
                        bakiEmak -= jumlahVal;
                    }
                }
            });

            const bakiKeseluruhan = bakiAbah + bakiEmak;
            
            document.getElementById('bakiHutangAbah').innerText = `RM ${Math.abs(bakiAbah).toFixed(2)}`;
            document.getElementById('bakiHutangEmak').innerText = `RM ${Math.abs(bakiEmak).toFixed(2)}`;
            document.getElementById('bakiHutangKeseluruhan').innerText = `RM ${Math.abs(bakiKeseluruhan).toFixed(2)}`;

            // --- 2. KEMASKINI SEKSYEN DANA ---
            const ringkasan = resDana.ringkasan || {};
            const dVelozS = parseFloat(ringkasan["Dana Servis Veloz"] || 0);
            const dPersonaS = parseFloat(ringkasan["Dana Servis Persona"] || 0);
            const dVelozR = parseFloat(ringkasan["Dana Roadtax Veloz"] || 0);
            const dPersonaR = parseFloat(ringkasan["Dana Roadtax Persona"] || 0);
            const dTabungan = parseFloat(ringkasan["Tabungan Masa Depan"] || 0);

            const totalDana = dVelozS + dPersonaS + dVelozR + dPersonaR + dTabungan;
            document.getElementById('total-dana').innerText = `RM ${totalDana.toFixed(2)}`;

            document.getElementById('senarai-dana').innerHTML = `
                <div class="flex justify-between items-center bg-slate-800/40 p-3 rounded-lg border border-slate-700/50">
                    <span class="text-sm text-slate-300"><i class="fas fa-car text-blue-400 w-5"></i> Servis Veloz</span>
                    <span class="font-semibold text-white">RM ${dVelozS.toFixed(2)}</span>
                </div>
                <div class="flex justify-between items-center bg-slate-800/40 p-3 rounded-lg border border-slate-700/50">
                    <span class="text-sm text-slate-300"><i class="fas fa-car-side text-blue-400 w-5"></i> Servis Persona</span>
                    <span class="font-semibold text-white">RM ${dPersonaS.toFixed(2)}</span>
                </div>
                <div class="flex justify-between items-center bg-slate-800/40 p-3 rounded-lg border border-slate-700/50">
                    <span class="text-sm text-slate-300"><i class="fas fa-file-contract text-purple-400 w-5"></i> Roadtax Veloz</span>
                    <span class="font-semibold text-white">RM ${dVelozR.toFixed(2)}</span>
                </div>
                <div class="flex justify-between items-center bg-slate-800/40 p-3 rounded-lg border border-slate-700/50">
                    <span class="text-sm text-slate-300"><i class="fas fa-file-contract text-purple-400 w-5"></i> Roadtax Persona</span>
                    <span class="font-semibold text-white">RM ${dPersonaR.toFixed(2)}</span>
                </div>
                <div class="flex justify-between items-center bg-emerald-900/20 p-3 rounded-lg border border-emerald-500/20 mt-2">
                    <span class="text-sm font-semibold text-emerald-400"><i class="fas fa-piggy-bank w-5"></i> Tabungan Masa Depan</span>
                    <span class="font-bold text-emerald-400">RM ${dTabungan.toFixed(2)}</span>
                </div>
            `;

            // --- 3. KEMASKINI SENARAI TRANSAKSI ---
            const container = document.getElementById('senaraiTransaksi');
            container.innerHTML = '';

            if (dataHutang.length === 0) {
                container.innerHTML = '<p class="text-center text-slate-500 text-sm">Tiada transaksi direkodkan.</p>';
                return;
            }

            // Reverse supaya yang terkini (di bawah sheets) naik ke atas aplikasi
            dataHutang.reverse().forEach(item => {
                const kJenis = Object.keys(item).find(k => k.toLowerCase().includes('jenis'));
                const kJumlah = Object.keys(item).find(k => k.toLowerCase().includes('jumlah'));
                const kTarikh = Object.keys(item).find(k => k.toLowerCase().includes('tarikh'));
                const kStatus = Object.keys(item).find(k => k.toLowerCase().includes('status'));
                const kID = Object.keys(item).find(k => k.toLowerCase().includes('id'));
                
                const jenisString = kJenis ? String(item[kJenis]) : "Transaksi";
                const jumlahVal = kJumlah ? parseFloat(item[kJumlah]) : 0;
                const isPengeluaran = jenisString.toLowerCase().includes("pengeluaran");

                const statusVal = kStatus ? item[kStatus] : "";
                const isMenunggu = statusVal === 'Menunggu';
                const statusColor = isMenunggu ? 'text-orange-400 bg-orange-400/10' : 'text-emerald-400 bg-emerald-400/10';
                
                let icon = isPengeluaran ? 'fa-arrow-left text-red-400' : 'fa-hand-holding-dollar text-emerald-400'; 
                if (jenisString.includes('Abah tolong')) { icon = 'fa-building-columns text-purple-400'; } 
                else if (jenisString.includes('Emak tolong')) { icon = 'fa-wallet text-pink-400'; }

                const tarikhRaw = kTarikh ? String(item[kTarikh]) : "";
                const tarikhPendek = tarikhRaw.length > 10 ? tarikhRaw.substring(0, 10) : tarikhRaw;
                const idVal = kID ? item[kID] : "";

                const cardHTML = `
                    <div class="glass-card rounded-xl p-4 flex items-center justify-between hover:bg-slate-800/50 transition">
                        <div class="flex items-center space-x-4">
                            <div class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center border border-slate-700">
                                <i class="fas ${icon}"></i>
                            </div>
                            <div>
                                <p class="font-semibold text-white">RM ${jumlahVal.toFixed(2)}</p>
                                <p class="text-xs text-slate-400">${tarikhPendek} • ${jenisString}</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <span class="text-xs px-2 py-1 rounded-md font-medium ${statusColor}">
                                ${isMenunggu ? '<i class="fas fa-clock mr-1"></i> Menunggu' : '<i class="fas fa-check mr-1"></i> Sah'}
                            </span>
                            ${isMenunggu && idVal ? `<button onclick="sahkanTransaksi('${idVal}')" class="block mt-2 text-xs text-blue-400 hover:text-blue-300 ml-auto"><i class="fas fa-check-circle mr-1"></i> Sahkan</button>` : ''}
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        // FUNGSI PRO: PENGHALAAN (ROUTING) DATA PINTAR
        async function hantarData(event) {
            event.preventDefault();
            const btn = document.getElementById('butangHantar');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Memproses...';
            btn.disabled = true;

            const jumlah = parseFloat(document.getElementById('jumlah').value);
            const jenis = document.getElementById('jenis').value;
            const nota = document.getElementById('nota').value || "Kemasukan";

            try {
                let penghantaran = []; // Senarai "tugas" tembakan data

                // LOGIK 1: Hasif bayar semula (Tembak ke DUA-DUA)
                if (jenis.includes("Hasif bayar semula")) {
                    penghantaran.push(
                        fetch(URL_DANA, {
                            method: 'POST',
                            body: JSON.stringify({ action: "tambahTransaksi", pin: "9999", jenis: jenis, jumlah: jumlah, nota: nota }),
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' } 
                        })
                    );
                    penghantaran.push(
                        fetch(URL_HUTANG, {
                            method: 'POST',
                            body: JSON.stringify({ jumlah: jumlah, jenis: jenis }),
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' } 
                        })
                    );
                } 
                // LOGIK 2: Masukkan Dana Biasa (Tembak ke DANA sahaja)
                else if (jenis === "Bayar Hutang") { 
                    penghantaran.push(
                        fetch(URL_DANA, {
                            method: 'POST',
                            body: JSON.stringify({ action: "tambahTransaksi", pin: "9999", jenis: jenis, jumlah: jumlah, nota: nota }),
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' } 
                        })
                    );
                } 
                // LOGIK 3: Abah/Emak tolong bayar (Tembak ke HUTANG sahaja)
                else if (jenis.includes("tolong bayar")) {
                    penghantaran.push(
                        fetch(URL_HUTANG, {
                            method: 'POST',
                            body: JSON.stringify({ jumlah: jumlah, jenis: jenis }),
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' } 
                        })
                    );
                }

                // Laksanakan tembakan serentak mengikut susunan lampu isyarat di atas
                await Promise.all(penghantaran);
                
                tutupModal();
                document.getElementById('borangTransaksi').reset();
                btn.innerHTML = 'Sahkan & Hantar';
                btn.disabled = false;
                
                // Muat semula skrin untuk paparkan baki dan dana terkini
                muatData();
            } catch (error) {
                alert('Gagal merekod. Sila cuba lagi.');
                btn.innerHTML = 'Sahkan & Hantar';
                btn.disabled = false;
            }
        }

        async function hantarPengeluaran(event) {
            event.preventDefault();
            const btn = document.getElementById('butangKeluar');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Memproses...';
            btn.disabled = true;

            const jenisTabung = document.getElementById('input-keluar-jenis').value;
            const jumlah = parseFloat(document.getElementById('input-keluar-jumlah').value);
            const tujuan = document.getElementById('input-keluar-tujuan').value;

            try {
                await fetch(URL_DANA, {
                    method: 'POST',
                    body: JSON.stringify({ action: "pengeluaranAdmin", pin: "9999", jenisTabung: jenisTabung, jumlah: jumlah, tujuan: tujuan }),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' } 
                });
                
                tutupModalKeluar();
                document.getElementById('borangKeluar').reset();
                btn.innerHTML = 'Sahkan Pengeluaran';
                btn.disabled = false;
                
                muatData();
            } catch (error) {
                alert('Ralat mengeluarkan dana.');
                btn.innerHTML = 'Sahkan Pengeluaran';
                btn.disabled = false;
            }
        }

        async function sahkanTransaksi(id) {
            if(!confirm("Sahkan transaksi ini? Baki hutang akan dikemas kini.")) return;
            document.getElementById('senaraiTransaksi').innerHTML = '<p class="text-center text-slate-500 text-sm py-4"><i class="fas fa-spinner fa-spin mr-2"></i> Mengesahkan rekod...</p>';

            try {
                await fetch(URL_HUTANG, {
                    method: 'POST',
                    body: JSON.stringify({ action: "sahkan", id: id }),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                muatData();
            } catch (error) {
                alert('Gagal mengesahkan rekod. Cuba lagi.');
                muatData();
            }
        }

        window.onload = muatData;
    </script>
</body>
</html>
